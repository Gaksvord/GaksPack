name: Update texture catalog

on:
  push:
    branches: [main]
    paths:
      - 'packs/**'
      - 'previews/**'
      - 'tools/sync_index.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gakspack-catalog
  cancel-in-progress: false

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Validate packs and refresh index
        run: python3 tools/sync_index.py --write
      - name: Publish index changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json packs
          if ! git diff --cached --quiet; then
            git commit -m "Update GaksPack texture index"
            git push origin HEAD:main
          fi
